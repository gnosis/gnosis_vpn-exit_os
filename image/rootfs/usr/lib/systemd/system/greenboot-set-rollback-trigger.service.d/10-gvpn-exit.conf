# greenboot-rs arms its rollback trigger from the staged deployment, but a
# download-only update is released by update-apply.sh inside the maintenance
# window; an ordinary reboot in between must not queue a rollback. The wrapper
# keeps greenboot's own command for everything else. See
# /usr/libexec/gvpn-exit/rollback-trigger.sh.
[Service]
ExecStop=
ExecStop=/usr/libexec/gvpn-exit/rollback-trigger.sh
