# hoprd's QUIC sockets inherit these defaults without requesting buffer sizes.
# Allow 4 MiB per direction for bursts; maxima alone do not enlarge defaults.
# Defaults apply to newly created sockets, not sockets already open.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.rmem_default = 4194304
net.core.wmem_default = 4194304

# VPN clients are NATed out of lan0
net.ipv4.ip_forward = 1
# Host IPv6 off: the blocklist and isolation rules are IPv4-only by design.
# ip6tables default DROP keeps this safe even if IPv6 is ever re-enabled.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
net.ipv6.conf.all.forwarding = 0
