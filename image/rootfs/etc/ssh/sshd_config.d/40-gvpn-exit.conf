# devops only, keys only. Sorts before 50-redhat.conf so these win.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
AllowUsers devops
# ListenAddress for the lan0 address and 127.0.0.1 (support tunnel), rendered
# by the NetworkManager dispatcher when lan0 comes up. Without it sshd listens
# everywhere; the firewall still only admits port 22 on lan0.
Include /run/gvpn-exit/sshd_config.d/*.conf
