# Local-only netdata: loopback, no registry, no cloud (cloud.conf via tmpfiles).
# devops reaches it with: ssh -L 19999:127.0.0.1:19999 devops@<device>
[db]
    mode = dbengine
    dbengine tier 0 retention size = 1GiB
    dbengine tier 1 retention size = 512MiB
    dbengine tier 2 retention size = 256MiB

[web]
    bind to = 127.0.0.1:19999
    allow connections from = localhost

[registry]
    enabled = no
