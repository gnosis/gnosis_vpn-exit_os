# Time comes from authenticated NTS sources of independent operators instead
# of the Fedora pool, so no unauthenticated third-party NTP is queried.
# NTS needs TCP/4460: where a network blocks it, the device falls back to its
# RTC, unless the local network supplies NTP through DHCP (sourcedir below),
# which is used as-is; the LAN is already trusted for operator SSH.
# The appliance keeps time, it does not serve it: no NTP server socket, so
# nothing reaches the appliance's UDP 123. chronyc keeps its command socket on
# loopback (323), which the firewall accepts on lo only.
port 0

server time.cloudflare.com iburst nts
server nts.netnod.se iburst nts
server ptbtime1.ptb.de iburst nts

# Sources the DHCP integration writes when the network supplies them; the
# directory appears only then.
sourcedir /run/chrony-dhcp

driftfile /var/lib/chrony/drift
makestep 1.0 3
rtcsync
ntsdumpdir /var/lib/chrony
logdir /var/log/chrony
