# Greenboot configuration of the GnosisVPN exit appliance.
GREENBOOT_MAX_BOOT_ATTEMPTS=3
GREENBOOT_WATCHDOG_CHECK_ENABLED=true
GREENBOOT_WATCHDOG_GRACE_PERIOD=24

# The stock repository DNS check is a required check: an offline boot would
# count as broken and could roll back a good update. The update-platforms
# check contacts ostree.fedoraproject.org on every boot, while the
# appliance staging timer manages updates. Connectivity is covered by the gvpn
# wanted.d checks instead, which never trigger a rollback.
DISABLED_HEALTHCHECKS=("01_repository_dns_check.sh" "01_update_platforms_check.sh")
