# Container storage of the builder container (tools/builder.sh). The podman
# image ships a storage.conf that routes overlay through fuse-overlayfs, which
# is meant for rootless use and makes every build step crawl. The builder runs
# privileged with its storage on a docker volume, so the kernel's overlay works
# directly. A store remembers the driver it was created with: a volume first
# used through fuse-overlayfs stays on it until it is removed once with
# `docker volume rm gvpn-exit-os-storage`.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options.overlay]
mountopt = "nodev"
