name: PR

on:
  pull_request:
  workflow_dispatch:

# Actions are pinned by commit, because a moving tag would let whoever controls
# it change what runs.
permissions:
  contents: read

env:
  GVPN_IMAGE_REPO: ${{ vars.GVPN_IMAGE_REPO || secrets.GVPN_IMAGE_REPO }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run just lint
        run: nix develop -c just lint

  test:
    name: Test
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run just test
        run: nix develop -c just test

  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Write the image-update public key
        env:
          COSIGN_PUB_CONTENT: ${{ vars.GVPN_COSIGN_PUB }}
        run: |
          if [[ -z "${COSIGN_PUB_CONTENT:-}" ]]; then
            echo "::error::Set the GVPN_COSIGN_PUB repository variable to the public half of the image-update key (cosign generate-key-pair)"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/keys"
          printf '%s\n' "${COSIGN_PUB_CONTENT}" > "${RUNNER_TEMP}/keys/cosign.pub"
          echo "GVPN_COSIGN_PUB=${RUNNER_TEMP}/keys/cosign.pub" >> "${GITHUB_ENV}"


      - name: Check pinned image references
        run: nix develop -c just check-pins

      # With overlayfs redirect_dir on, as the runner kernel ships it, Podman
      # cannot use overlay's native diff and commits every build step by
      # walking the whole rootfs, about a minute per step. Turning it off for
      # new mounts restores the native diff.
      - name: Let Podman use overlay's native diff
        run: echo N | sudo tee /sys/module/overlay/parameters/redirect_dir

      # Ubuntu 26.04 loads AppArmor's bwrap-userns-restrict profile, which runs
      # everything bubblewrap starts without capabilities. osbuild runs each
      # bootc-image-builder stage through bubblewrap, and those stages mount
      # /dev and chown files as root. The runner is discarded after the job.
      - name: Let osbuild's bubblewrap stages keep their capabilities
        run: |
          if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
          fi

      - name: Run just build
        run: nix develop -c just build

      - name: Build the console-configured installer ISO
        run: nix develop -c just iso-console-only
