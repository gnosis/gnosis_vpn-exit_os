name: Promote Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label or digest to promote: the version label printed by the build, a tag such as 1.2.3, or sha256:...'
        required: true
        type: string
      channel:
        description: 'Target channel to promote to'
        required: true
        type: choice
        options:
          - canary
          - stable
        default: canary

# Promotion moves the image channel and publishes the installer ISO of that
# channel: the ISO is built here, from the promoted image, because an ISO
# installs a device that follows one channel for its updates.
#
# Actions are pinned by commit: a moving tag could change what verifies
# signatures, runs next to the image-update signing key and moves a channel
# the devices track.
permissions:
  contents: read

env:
  GVPN_IMAGE_REPO: ${{ vars.GVPN_IMAGE_REPO || secrets.GVPN_IMAGE_REPO }}
  # Required: a repository of its own for the installer ISO, tagged
  # <version>-<channel> and with the channel names.
  GVPN_ISO_REPO: ${{ vars.GVPN_ISO_REPO }}

jobs:
  promote:
    name: Promote
    runs-on: depot-ubuntu-22.04-4
    # id-token lets the job ask GitHub for the OIDC token that Google Cloud
    # exchanges for registry access.
    permissions:
      contents: read
      id-token: write
    # The environment restricts promotion to a branch and can require
    # reviewers; the signing key of the ISO and its passphrase are its secrets.
    environment: release
    steps:
      # A convenience check, not the control: a dispatch from another branch
      # runs that branch's copy of this workflow. The control is the branch
      # restriction of the `release` environment.
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF}" != "refs/heads/main" ]]; then
            echo "::error::This job moves a channel the devices track; run it from main, not ${REF}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before anything is built or moved: without a usable ISO repository the
      # ISO could not be published, and the image channel would move on its
      # own. This is the check tools/publish-iso.sh makes.
      - name: Require the ISO repository
        run: |
          source tools/lib.sh
          if ! iso_repo >/dev/null; then
            echo "::error::Set the GVPN_ISO_REPO repository variable to the installer ISO repository, a repository apart from the image's"
            exit 1
          fi

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Write the image-update public key
        env:
          COSIGN_PUB_CONTENT: ${{ vars.GVPN_COSIGN_PUB }}
        run: |
          if [[ -z "${COSIGN_PUB_CONTENT:-}" ]]; then
            echo "::error::Set the GVPN_COSIGN_PUB repository variable to the public half of the image-update key"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/keys"
          printf '%s\n' "${COSIGN_PUB_CONTENT}" > "${RUNNER_TEMP}/keys/cosign.pub"
          echo "GVPN_COSIGN_PUB=${RUNNER_TEMP}/keys/cosign.pub" >> "${GITHUB_ENV}"

      # With overlayfs redirect_dir on, as the runner kernel ships it, Podman
      # cannot use overlay's native diff and commits every step by walking the
      # whole rootfs. Turning it off for new mounts restores the native diff.
      - name: Let Podman use overlay's native diff
        run: echo N | sudo tee /sys/module/overlay/parameters/redirect_dir

      # The ISO embeds the promoted image itself: its signature is verified,
      # then that digest is pulled into the builder as the built image. No
      # login: the image repository serves anonymous pulls, as the devices
      # pull it.
      - name: Pull the verified image into the builder
        env:
          VERSION: ${{ inputs.version }}
        run: nix develop -c just pull-image "${VERSION}"

      # Built before any tag moves, so a failed build leaves both channels
      # where they were. The channel is baked into the ISO: the installed
      # device follows it for its updates.
      - name: Build the console-configured installer ISO of the channel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: nix develop -c just channel="${CHANNEL}" iso-console-only

      # The signing key is only on disk for the promotion and the ISO push.
      # It is checked before any tag moves: a key that is missing, does not
      # open with its passphrase or is not the pair of GVPN_COSIGN_PUB would
      # otherwise stop the ISO push after the image channel moved.
      - name: Write and check the image-update signing key
        env:
          COSIGN_KEY_CONTENT: ${{ secrets.GVPN_COSIGN_KEY }}
          COSIGN_PASSPHRASE: ${{ secrets.GVPN_COSIGN_PASSPHRASE }}
        run: |
          if [[ -z "${COSIGN_KEY_CONTENT:-}" ]]; then
            echo "::error::Set the GVPN_COSIGN_KEY secret (cosign generate-key-pair)"
            exit 1
          fi
          printf '%s\n' "${COSIGN_KEY_CONTENT}" > "${RUNNER_TEMP}/keys/cosign.key"
          chmod 0600 "${RUNNER_TEMP}/keys/cosign.key"
          # An empty file is the passphrase of a key without one, and cosign
          # cannot ask for it on a runner.
          printf '%s' "${COSIGN_PASSPHRASE:-}" > "${RUNNER_TEMP}/keys/cosign.passphrase"
          chmod 0600 "${RUNNER_TEMP}/keys/cosign.passphrase"
          # cosign derives the public half only when the passphrase opens the key.
          if ! COSIGN_PASSWORD="${COSIGN_PASSPHRASE:-}" nix develop -c cosign public-key \
              --key "${RUNNER_TEMP}/keys/cosign.key" --outfile "${RUNNER_TEMP}/keys/derived.pub" </dev/null; then
            echo "::error::GVPN_COSIGN_KEY does not open with GVPN_COSIGN_PASSPHRASE"
            exit 1
          fi
          derived="$(openssl pkey -pubin -in "${RUNNER_TEMP}/keys/derived.pub" -outform DER | sha256sum)"
          expected="$(openssl pkey -pubin -in "${GVPN_COSIGN_PUB}" -outform DER | sha256sum)"
          if [[ "${derived}" != "${expected}" ]]; then
            echo "::error::GVPN_COSIGN_KEY is not the private half of GVPN_COSIGN_PUB; devices would refuse what it signs"
            exit 1
          fi
          {
            echo "GVPN_COSIGN_KEY=${RUNNER_TEMP}/keys/cosign.key"
            echo "GVPN_COSIGN_PASSPHRASE_FILE=${RUNNER_TEMP}/keys/cosign.passphrase"
          } >> "${GITHUB_ENV}"

      # Only the registry writes need the login: the verification and the pull
      # above are anonymous. Google Artifact Registry is reached through
      # Workload Identity Federation, so no registry credential is stored; the
      # token lasts an hour, so it is fetched after the ISO build, right
      # before the writes.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@f15435652c572ad5688af679f0e2b153c98c9773 # setup-gcp-v4
        with:
          workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
          service_account: gvpn-exit-os-release@gnosisvpn-production.iam.gserviceaccount.com

      # A GVPN_ISO_REPO on another Artifact Registry host is logged in to with
      # the same token.
      - name: Log in to the registry
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          printf '%s' "${ACCESS_TOKEN}" \
            | docker login "${GVPN_IMAGE_REPO%%/*}" --username oauth2accesstoken --password-stdin
          if [[ "${GVPN_ISO_REPO%%/*}" != "${GVPN_IMAGE_REPO%%/*}" ]]; then
            printf '%s' "${ACCESS_TOKEN}" \
              | docker login "${GVPN_ISO_REPO%%/*}" --username oauth2accesstoken --password-stdin
          fi
          echo "REGISTRY_AUTH_FILE=${DOCKER_CONFIG:-${HOME}/.docker}/config.json" >> "${GITHUB_ENV}"

      # The image channel first: tools/publish-iso.sh publishes an ISO for a
      # channel only once the image channel serves the image it embeds.
      - name: Run tools/promote.sh
        env:
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          nix develop -c tools/promote.sh "${VERSION}" "${CHANNEL}"

      # Pushes <version>-<channel> and moves the channel in the ISO
      # repository. A version promoted to this channel before has its ISO
      # published already: the channel then moves back to that one.
      - name: Publish the installer ISO and move its channel
        run: nix develop -c just publish-iso

      # Read back from the registries rather than from the push logs.
      - name: Summarize the promotion
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          version="$(< output/iso/bootiso/install.iso.version)"
          image_digest="$(nix develop -c skopeo inspect --no-tags --format '{{.Digest}}' "docker://${GVPN_IMAGE_REPO}:${CHANNEL}")"
          iso_digest="$(nix develop -c oras manifest fetch --descriptor "${GVPN_ISO_REPO}:${CHANNEL}" | jq -r .digest)"
          {
            echo "## Promoted \`${version}\` to \`${CHANNEL}\`"
            echo
            echo "| | Reference | Digest |"
            echo "| --- | --- | --- |"
            echo "| Image | \`${GVPN_IMAGE_REPO}:${CHANNEL}\` | \`${image_digest}\` |"
            echo "| Installer ISO | \`${GVPN_ISO_REPO}:${CHANNEL}\`, \`${GVPN_ISO_REPO}:${version}-${CHANNEL}\` | \`${iso_digest}\` |"
            echo
            echo "A device installed from this ISO follows \`${GVPN_IMAGE_REPO}:${CHANNEL}\` for its updates."
            echo
            echo "Pull and verify the ISO: \`GVPN_ISO_REPO=${GVPN_ISO_REPO} GVPN_COSIGN_PUB=<update key .pub> just pull-iso ${CHANNEL}\`."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup signing keys
        if: always()
        run: rm -rf "${RUNNER_TEMP}/keys"
