name: Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Actions are pinned by commit, because a moving tag would let whoever controls
# it change what runs next to the image-update signing key.
permissions:
  contents: read

env:
  GVPN_IMAGE_REPO: ${{ vars.GVPN_IMAGE_REPO || secrets.GVPN_IMAGE_REPO }}

jobs:
  build-and-push:
    name: Build and Push
    runs-on: depot-ubuntu-22.04-4
    # id-token lets the job ask GitHub for the OIDC token that Google Cloud
    # exchanges for registry access.
    permissions:
      contents: read
      id-token: write
    # The signing key and its passphrase are environment secrets: an
    # environment can restrict them to a branch and require reviewers, which a
    # repository secret cannot.
    environment: release
    steps:
      # A convenience check, not the control: a dispatch from another branch
      # runs that branch's copy of this workflow. The control is the branch
      # restriction of the `release` environment.
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF}" != "refs/heads/main" ]]; then
            echo "::error::This job signs and pushes an image; run it from main, not ${REF}"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The image is built with the public half, so it is on disk before the
      # build and the private half is not.
      - name: Write the image-update public key
        env:
          COSIGN_PUB_CONTENT: ${{ vars.GVPN_COSIGN_PUB }}
        run: |
          if [[ -z "${COSIGN_PUB_CONTENT:-}" ]]; then
            echo "::error::Set the GVPN_COSIGN_PUB repository variable to the public half of the image-update key (cosign generate-key-pair)"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/keys"
          printf '%s\n' "${COSIGN_PUB_CONTENT}" > "${RUNNER_TEMP}/keys/cosign.pub"
          echo "GVPN_COSIGN_PUB=${RUNNER_TEMP}/keys/cosign.pub" >> "${GITHUB_ENV}"


      - name: Check pinned image references
        run: nix develop -c just check-pins

      # With overlayfs redirect_dir on, as the runner kernel ships it, Podman
      # cannot use overlay's native diff and commits every build step by
      # walking the whole rootfs, about a minute per step. Turning it off for
      # new mounts restores the native diff.
      - name: Let Podman use overlay's native diff
        run: echo N | sudo tee /sys/module/overlay/parameters/redirect_dir

      - name: Run just build
        run: nix develop -c just build

      # The ISO is built here as a check and is not published: an image that
      # cannot be made into an installer must not be pushed. The published ISO
      # is built by the Promote Image workflow, for the channel the version is
      # promoted to, because an ISO installs a device that follows one channel.
      # The image is already in the builder's storage, so only the disk build
      # runs here.
      - name: Build the console-configured installer ISO
        run: nix develop -c just iso-console-only

      # The signing key is only on disk for the push.
      - name: Write the image-update signing key
        env:
          COSIGN_KEY_CONTENT: ${{ secrets.GVPN_COSIGN_KEY }}
          COSIGN_PASSPHRASE: ${{ secrets.GVPN_COSIGN_PASSPHRASE }}
        run: |
          if [[ -z "${COSIGN_KEY_CONTENT:-}" ]]; then
            echo "::error::Set the GVPN_COSIGN_KEY secret (cosign generate-key-pair)"
            exit 1
          fi
          printf '%s\n' "${COSIGN_KEY_CONTENT}" > "${RUNNER_TEMP}/keys/cosign.key"
          chmod 0600 "${RUNNER_TEMP}/keys/cosign.key"
          # An empty file is the passphrase of a key without one, and skopeo
          # cannot ask for it on a runner.
          printf '%s' "${COSIGN_PASSPHRASE:-}" > "${RUNNER_TEMP}/keys/cosign.passphrase"
          chmod 0600 "${RUNNER_TEMP}/keys/cosign.passphrase"
          {
            echo "GVPN_COSIGN_KEY=${RUNNER_TEMP}/keys/cosign.key"
            echo "GVPN_COSIGN_PASSPHRASE_FILE=${RUNNER_TEMP}/keys/cosign.passphrase"
          } >> "${GITHUB_ENV}"

      # Only the push talks to the registry: check-pins and the build pull
      # public images. Google Artifact Registry is reached through Workload
      # Identity Federation, so no registry credential is stored; the token
      # lasts an hour, so it is fetched right before the push.
      - name: Authenticate to Google Cloud
        id: gcp
        uses: hoprnet/hopr-workflows/actions/setup-gcp@837b94246698537325ecc664dfb22c72c0d6b8ed # setup-gcp-v4
        with:
          workload_identity_provider: projects/656686060169/locations/global/workloadIdentityPools/gnosisvpn-gh-pool/providers/github-provider
          service_account: gvpn-exit-os-release@gnosisvpn-production.iam.gserviceaccount.com

      - name: Log in to the registry
        env:
          ACCESS_TOKEN: ${{ steps.gcp.outputs.access_token }}
        run: |
          printf '%s' "${ACCESS_TOKEN}" \
            | docker login "${GVPN_IMAGE_REPO%%/*}" --username oauth2accesstoken --password-stdin
          echo "REGISTRY_AUTH_FILE=${DOCKER_CONFIG:-${HOME}/.docker}/config.json" >> "${GITHUB_ENV}"

      - name: Run just push (push image without channel tag)
        run: nix develop -c just push

      # What was published, read back from the registry rather than from the
      # push logs, on the run's summary page.
      - name: Summarize the release
        run: |
          iso_dir=output/iso/bootiso
          version="$(< "${iso_dir}/install.iso.version")"
          image_digest="$(nix develop -c skopeo inspect --no-tags --format '{{.Digest}}' "docker://${GVPN_IMAGE_REPO}:${version}")"
          key_sha256="$(openssl pkey -pubin -in "${GVPN_COSIGN_PUB}" -outform DER | sha256sum | cut -d' ' -f1)"
          {
            echo "## Published \`${version}\`"
            echo
            echo "| | Reference | Digest |"
            echo "| --- | --- | --- |"
            echo "| Image | \`${GVPN_IMAGE_REPO}:${version}\` | \`${image_digest}\` |"
            echo
            echo "Signed with the image-update key, SHA-256 fingerprint \`${key_sha256}\`; compare it with the key you verify against: \`openssl pkey -pubin -in cosign.pub -outform DER | sha256sum\`."
            echo
            echo "No channel tag moved: devices on \`canary\` do not see this build yet. An installer ISO was built as a check and not published."
            echo
            echo "Promote: run **Promote Image** with version \`${version}\` and channel \`canary\`. It moves the image channel and publishes the installer ISO that follows it."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Cleanup signing keys
        if: always()
        run: rm -rf "${RUNNER_TEMP}/keys"
